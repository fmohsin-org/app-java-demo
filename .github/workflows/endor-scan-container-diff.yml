name: Build, Scan, and Push - Container Diff

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Used to upload Sarif artifact to GitHub
      contents: read # Used to check out a private repository
      actions: read # Required for private repositories to upload Sarif files. GitHub Advanced Security licenses are required.
      id-token: write # Used for keyless authentication with Endor Labs
      issues: write # Required to create a comment or modify labels
      pull-requests: write # Required to automatically comment on PRs for new policy violations

    steps:
    # Build: Step 1
      - name: Checkout repository
        uses: actions/checkout@v4

    # Build: Step 2
      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"

    # Build: Step 3
      - name: Install Dependencies
        run: mvn clean install

    # Build: Step 4
      - name: Endor code scan - Pull Request
        if: github.event_name == 'pull_request'
        uses: endorlabs/github-action@f46ffb04c928a9c9c356f9627bd60b710ed0963e # v1.1.13
        with:
          namespace: farhan-demo
          scan_dependencies: true
          scan_secrets: true
          scan_ai_sast: true
          pr: true
          enable_pr_comments: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          scan_summary_output_type: table

      # Build: Step 6
      - name: Build a Package
        run: mvn -B package dependency:copy-dependencies

      # Build: Step 7
      - name: Temporarily save jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifact
          path: ${{ github.workspace }}/target/endor-java-webapp-demo.jar
          retention-days: 1

      - name: Temporarily save dependency folder
        uses: actions/upload-artifact@v4
        with:
          name: dependency-artifact
          path: ${{ github.workspace }}/target/dependency/
          retention-days: 1

  # Job: Deploy

  deploy:
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest
    needs: build
    env:
      IMAGE: ${{ secrets.DOCKER_USERNAME }}/endor-java-webapp-demo:${{ github.sha }}
      PROJECT_NAME: ${{ inputs.project_name != '' && inputs.project_name || format('{0}/endor-java-webapp-demo', secrets.DOCKER_USERNAME) }}
    steps:
      # Deploy: Step 1
      - name: Checkout repository
        uses: actions/checkout@v4

      # Deploy: Step 2
      - name: Download Jar
        uses: actions/download-artifact@v4
        with:
          name: jar-artifact
          path: target/

      - name: Download dependencies
        uses: actions/download-artifact@v4
        with:
          name: dependency-artifact
          path: target/dependency

      # Deploy: Step 3
      - name: Build container
        run: docker build . -t "$IMAGE"

      # Deploy: Step 4
      # Compare this build with the project's existing main-context container scan.
      # https://docs.endorlabs.com/scan/containers/incremental-container-scanning#at-scan-time
      - name: Setup Endorctl
        uses: endorlabs/github-action/setup@f46ffb04c928a9c9c356f9627bd60b710ed0963e # v1.1.13
        with:
          namespace: farhan-demo

      - name: Endor container diff scan
        id: endor-diff
        run: |
          set +e
          endorctl container scan --image="$IMAGE" --project-name=app-java-demo --namespace=farhan-demo --as-ref --diff --suppress-baseline-findings
          status=$?
          set -e
          echo "endorctl exited with $status"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      # Deploy: Step 5
      - name: Get image digest
        run: |
          IMAGE_SHA=$(docker inspect "$IMAGE" | jq -r '.[].Id')
          IMAGE_REPO="${IMAGE%%:*}"
          echo "ARTIFACT=${IMAGE_REPO}@${IMAGE_SHA}" >> "$GITHUB_ENV"

      # Deploy: Step 6
      - name: Sign with Endor Labs
        uses: endorlabs/github-action/sign@f46ffb04c928a9c9c356f9627bd60b710ed0963e # v1.1.13
        with:
          namespace: farhan-demo
          artifact_name: ${{ env.ARTIFACT }}
          certificate_oidc_issuer: https://token.actions.githubusercontent.com
          source_repository_ref: ${{ github.ref }}

      # Deploy: Step 7
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Deploy: Step 8
      - name: Docker push
        run: docker push "$IMAGE"
