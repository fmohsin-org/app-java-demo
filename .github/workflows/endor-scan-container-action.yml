name: Container Scan with GitHub Action

on:
  workflow_dispatch:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"

      - name: Install dependencies
        run: mvn -B clean install

      - name: Build package and copy dependencies
        run: mvn -B package dependency:copy-dependencies

      - name: Save jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifact
          path: ${{ github.workspace }}/target/endor-java-webapp-demo.jar
          retention-days: 1

      - name: Save dependency folder
        uses: actions/upload-artifact@v4
        with:
          name: dependency-artifact
          path: ${{ github.workspace }}/target/dependency/
          retention-days: 1

  scan:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Used to upload Sarif artifact to GitHub
      contents: read # Used to check out a private repository
      actions: read # Required for private repositories to upload Sarif files. GitHub Advanced Security licenses are required.
      id-token: write # Used for keyless authentication with Endor Labs
      issues: write # Required to create a comment or modify labels
      pull-requests: write # Required to automatically comment on PRs for new policy violations
    env:
      IMAGE: ${{ secrets.DOCKER_USERNAME }}/endor-java-webapp-demo:${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: jar-artifact
          path: target/

      - name: Download dependencies
        uses: actions/download-artifact@v4
        with:
          name: dependency-artifact
          path: target/dependency

      - name: Build container
        run: docker build . -t "$IMAGE"

      - name: Endor container scan - Pull Request
 #       if: github.event_name == 'pull_request'
        uses: endorlabs/github-action@f46ffb04c928a9c9c356f9627bd60b710ed0963e # v1.1.13
        with:
          namespace: farhan-demo
          scan_dependencies: false
          scan_secrets: false
          scan_sast: false
          scan_container: true
          image: ${{ env.IMAGE }}
          project_name: app-java-demo-github-action
          enable_pr_comments: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          scan_summary_output_type: table